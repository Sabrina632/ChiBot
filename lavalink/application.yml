# Configuracao do servidor Lavalink v4 (audio do ChiBot).
# A senha precisa bater com o LAVALINK_PASSWORD do .env.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Fonte do YouTube mantida como plugin (a embutida foi descontinuada).
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    # Anti-travada em VPS pequena: buffers maiores absorvem picos de CPU/rede
    # (custo: ~10s de audio pre-decodificado na memoria, alguns MB so).
    bufferDurationMs: 1000        # padrao 400: quanto o Lavalink envia adiantado
    frameBufferDurationMs: 10000  # padrao 5000: quanto fica pre-decodificado
    # Buffer de frames que NAO realoca a cada frame: corta o lixo de GC do audio
    # (pausa de GC = travada). Casa com o frameBuffer grande acima.
    nonAllocatingFrameBuffer: true
    opusEncodingQuality: 10
    resamplingQuality: LOW        # resampling barato; HIGH come CPU a toa aqui
    useSeekGhosting: true
    sources:
      # YouTube embutido desligado: quem cuida disso e o plugin acima.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # O login do play e gerenciado pelo BOT (YtOauth manda o access token no
    # userData de cada track), mas o loadtracks (busca/resolucao) roda no node
    # e em IP de datacenter tambem precisa de login. Em vez de editar este
    # arquivo (gera conflito no git pull), ligue via .env ao lado do compose:
    #   YOUTUBE_OAUTH_ENABLED=true
    #   YOUTUBE_REFRESH_TOKEN=1//...
    # As variaveis PLUGINS_YOUTUBE_OAUTH_* do compose sobrescrevem isto aqui.
    oauth:
      enabled: false
    # Decifrador remoto de assinaturas (servico yt-cipher do compose): quando
    # o YouTube muda o base.js, e ele quem mantem o playback funcionando
    # (o decifrador local do plugin quebra com "Must find sig function").
    remoteCipher:
      url: "http://yt-cipher:8001"
    # Ordem de clientes usados pra resolver streams/buscas.
    # TV e o unico que usa o login do OAuth (os outros nao usam o token e
    # podem ser bloqueados em IP de datacenter).
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    # root em WARN corta o ruido de Spring/Netty; o logger do Lavalink fica em
    # INFO pra ainda mostrar conexao do node, faixas e erros de playback.
    root: WARN
    lavalink: INFO