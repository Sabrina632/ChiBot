# Configuracao do servidor Lavalink v4 (audio do ChiBot).
# A senha precisa bater com o "LavalinkPassword" do ChiConfig.json.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Fonte do YouTube mantida como plugin (a embutida foi descontinuada).
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      # YouTube embutido desligado: quem cuida disso e o plugin acima.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # O login do play e gerenciado pelo BOT (YtOauth manda o access token no
    # userData de cada track), mas o loadtracks (busca/resolucao) roda no node
    # e em IP de datacenter tambem precisa de login. Em vez de editar este
    # arquivo (gera conflito no git pull), ligue via .env ao lado do compose:
    #   YOUTUBE_OAUTH_ENABLED=true
    #   YOUTUBE_REFRESH_TOKEN=1//...
    # As variaveis PLUGINS_YOUTUBE_OAUTH_* do compose sobrescrevem isto aqui.
    oauth:
      enabled: false
    # Ordem de clientes usados pra resolver streams/buscas.
    # TVHTML5EMBEDDED e o que carrega videos usando o login do OAuth
    # (os outros nao usam o token e continuam bloqueados em IP de datacenter).
    clients:
      - MUSIC
      - TVHTML5EMBEDDED
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO