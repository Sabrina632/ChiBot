# Configuracao do servidor Lavalink v4 (audio do ChiBot).
# A senha precisa bater com o "LavalinkPassword" do ChiConfig.json.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Fonte do YouTube mantida como plugin (a embutida foi descontinuada).
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      # YouTube embutido desligado: quem cuida disso e o plugin acima.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth: o YouTube bloqueia IPs de datacenter sem login ("This video
    # requires login"). Na primeira subida com oauth ligado, o log mostra um
    # codigo pra ativar em https://www.google.com/device — use uma conta
    # GOOGLE DESCARTAVEL (ha risco de ban). Depois de autorizar, o log imprime
    # um refresh token: cole ele abaixo pra nao precisar logar de novo.
    oauth:
      enabled: true
      # refreshToken: "1//..."
      # skipInitialization: true
    # Ordem de clientes usados pra resolver streams/buscas.
    # TV e o client que de fato usa o login do OAuth pro playback.
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO