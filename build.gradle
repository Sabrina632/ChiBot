plugins {
    id 'java'
    id 'application'
}

group = 'org.chibot'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'org.chibot.ChiMain'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    // Releases do lavalink-client (musica via servidor Lavalink)
    maven { url 'https://maven.lavalink.dev/releases' }
}

dependencies {
    // JDA - Java Discord API
    implementation 'net.dv8tion:JDA:6.5.0'

    // Cliente Lavalink v4 (player de musica roda no servidor Lavalink, nao no bot)
    implementation 'dev.arbjerg:lavalink-client:3.4.0'

    // JSON
    implementation 'org.json:json:20250107'

    // HTML scraping (Party Finder via xivpf.com)
    implementation 'org.jsoup:jsoup:1.18.3'

    // SQLite legado: usado só pela migração de dados pro PostgreSQL
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    // PostgreSQL: banco principal (o sqlite-jdbc acima fica só pra ler os
    // bancos legados na migração de dados)
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'com.zaxxer:HikariCP:6.2.1'

    // PostgreSQL real embarcado nos testes (sem Docker); o BOM pina os
    // binários no PostgreSQL 16, a mesma major do banco de produção
    testImplementation platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.4.0')
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'

    // Logging
    implementation 'ch.qos.logback:logback-classic:1.5.18'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}