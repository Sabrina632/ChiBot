services:
  chibot:
    build: .
    image: chibot:latest
    container_name: chibot
    restart: unless-stopped
    # Monta o config do host dentro do container. Edite o .env na VPS
    # (DISCORD_TOKEN, PREFIX, GUILD_ID) e reinicie o container — sem rebuildar.
    volumes:
      - ./.env:/app/.env
      # Banco do Party Finder (ChiData.db). Volume nomeado pra persistir entre
      # recriacoes do container (docker compose up --build nao apaga).
      - chibot-data:/app/data
    # Logs ficam acessiveis via "docker logs chibot".
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Limita a heap do bot: sem isso a JVM pega ate 25% da RAM da VPS e
    # espreme o Lavalink (que e quem nao pode engasgar). Orcamento pra VPS de
    # 2G (t3a.small): 512M de teto pro bot + 768M fixos do Lavalink cabem com
    # folga pro yt-cipher e o SO — mantenha 1-2G de swap pra absorver picos.
    environment:
      - _JAVA_OPTIONS=-Xmx512M
    # Musica: o bot fala com o Lavalink pela rede interna do compose.
    # No .env da VPS, use LAVALINK_URI=ws://lavalink:2333.
    # service_healthy: segura o bot ate o Lavalink RESPONDER (nao so iniciar),
    # senao o boot enche o log de "Failed to connect to WS" ate ele subir.
    depends_on:
      lavalink:
        condition: service_healthy

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    environment:
      # G1 com pausa-alvo curta: pausas longas de GC viram travada no audio.
      # ParallelRefProcEnabled encurta a fase de processar referencias do G1
      # (uma das maiores fontes de pausa). Heap fixa de 768M (Xms=Xmx) pra
      # menos GC, e AlwaysPreTouch pra commitar as paginas no boot — runtime
      # sem page-fault nem resize de heap. Numa VPS de 2G, esses 768M ficam
      # reservados de cara; e proposital: o audio e quem nao pode engasgar.
      - _JAVA_OPTIONS=-Xms768M -Xmx768M -XX:+UseG1GC -XX:MaxGCPauseMillis=40 -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch
      # Login do YouTube no NODE: necessario pro loadtracks (busca/resolucao)
      # em IP de datacenter — o token por track que o bot manda cobre so o
      # play. Crie um arquivo .env ao lado deste compose (NUNCA versionar):
      #   YOUTUBE_OAUTH_ENABLED=true
      #   YOUTUBE_REFRESH_TOKEN=1//...   (o mesmo que o bot usa)
      # Spring mapeia estas variaveis por cima do application.yml montado.
      - PLUGINS_YOUTUBE_OAUTH_ENABLED=${YOUTUBE_OAUTH_ENABLED:-false}
      - PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - PLUGINS_YOUTUBE_OAUTH_SKIPINITIALIZATION=true
      # Senha do node vinda do MESMO .env que o bot lê (LAVALINK_PASSWORD):
      # troque lá e pronto — sobrescreve o "youshallnotpass" do application.yml
      # versionado, sem editar arquivo e sem conflito no git pull.
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      # Sem volume pros plugins: volume nomeado nasce como root e o Lavalink
      # (uid 322) nao consegue gravar nele. O plugin do YouTube e pequeno e o
      # servidor baixa de novo sozinho quando o container e recriado.
    # Porta exposta SO no loopback: o bot rodando fora do Docker (dev local)
    # alcanca em ws://localhost:2333, mas nada fica aberto pra internet.
    ports:
      - "127.0.0.1:2333:2333"
    # Pronto = REST /v4/info respondendo com auth (wget vem na imagem).
    # start_period cobre o boot do Spring sem contar como falha.
    healthcheck:
      test: 'wget --header="Authorization: ${LAVALINK_PASSWORD:-youshallnotpass}" -qO- http://127.0.0.1:2333/v4/info || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - yt-cipher

  # Resolve os desafios de assinatura do player do YouTube (base.js) pro
  # plugin do Lavalink. Sem ele, quando o YouTube muda o script, o playback
  # quebra com "Must find sig function from script".
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS
    # Sem "ports": so o Lavalink precisa alcancar (rede interna do compose).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chibot-data: